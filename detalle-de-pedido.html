<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <main class="content">
      <a href="mis-pedidos.html" class="back-link">&larr; Mis pedidos</a>
      <h1 class="title">Detalle de pedido</h1>

      <div class="card">
        <div class="row-info">
          <span class="label-muted">Cliente</span>
          <span id="cliente" class="value">Sofía Rodríguez</span>
        </div>
        <div class="row-info">
          <span class="label-muted">Producto</span>
          <span id="producto" class="value">Smartwatch Series 9</span>
        </div>
        <div class="row-info">
          <span class="label-muted">Proveedor</span>
          <span id="proveedor" class="value">1688.com</span>
        </div>
        <div class="row-info">
          <span class="label-muted">Fecha del pedido</span>
          <span id="fecha" class="value">18 ago 2026</span>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Resumen financiero</h2>
        <div class="row-info">
          <span class="label-muted">Precio total</span>
          <span id="precio-total" class="value">$150.00</span>
        </div>
        <div class="row-info">
          <span class="label-muted">Monto adelantado</span>
          <span id="monto-adelantado" class="value">$50.00</span>
        </div>
        <div class="saldo-box">
          <span class="saldo-label">Saldo pendiente</span>
          <span id="saldo-pendiente" class="saldo-monto">calculando...</span>
        </div>
      </div>

      <button id="btn-pagado" type="button" class="btn-primary">Marcar como pagado</button>
    </main>

    <nav class="tabbar">
      <a href="index.html" class="tab">
        <span class="icon">＋</span>
        <span>Registrar</span>
      </a>
      <a href="mis-pedidos.html" class="tab">
        <span class="icon">≡</span>
        <span>Mis Pedidos</span>
      </a>
      <a href="detalle-de-pedido.html" class="tab active">
        <span class="icon">▤</span>
        <span>Detalle</span>
      </a>
      <a href="estado-de-mi-pedido.html" class="tab">
        <span class="icon">◎</span>
        <span>Estado</span>
      </a>
    </nav>
  </div>

  <script src="reglas.js"></script>
  <script>
    // Datos del pedido (en un sistema real vendrían de la base de datos)
    const pedido = {
      precioTotal: 150.0,
      montoAdelantado: 50.0,
      pagado: false,
    };

    function actualizarSaldo() {
      const saldo = calcularSaldoPendiente(
        pedido.precioTotal,
        pedido.montoAdelantado,
        pedido.pagado
      );

      const el = document.getElementById("saldo-pendiente");
      if (saldo === null) {
        el.textContent = "Datos incompletos";
      } else {
        el.textContent = "$" + saldo.toFixed(2);
      }
    }

    document.getElementById("btn-pagado").addEventListener("click", () => {
      pedido.pagado = true;
      actualizarSaldo();
      const btn = document.getElementById("btn-pagado");
      btn.textContent = "Pagado ✓";
      btn.style.background = "#16A34A";
    });

    actualizarSaldo();
  </script>
</body>
</html>
